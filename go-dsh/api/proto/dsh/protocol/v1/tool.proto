syntax = "proto3";

package dsh.protocol.v1;

option go_package = "github.com/yy59750901/go-dsh/gen/go/dsh/protocol/v1;protocolv1";

import "dsh/protocol/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message ToolDefinition {
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3;
  google.protobuf.Struct output_schema = 4;
  string version = 5;
  uint64 generation = 6;
  repeated string required_capabilities = 7;
}

message ToolCall {
  string call_id = 1;
  string session_id = 2;
  string turn_id = 3;
  string step_id = 4;
  string tool_name = 5;
  google.protobuf.Struct arguments = 6;
  string definition_version = 7;
  uint64 generation = 8;
  string idempotency_key = 9;
  google.protobuf.Duration timeout = 10;
  TraceContext trace = 11;
}

enum ToolResultStatus {
  TOOL_RESULT_STATUS_UNSPECIFIED = 0;
  TOOL_RESULT_STATUS_SUCCEEDED = 1;
  TOOL_RESULT_STATUS_FAILED = 2;
  TOOL_RESULT_STATUS_CANCELLED = 3;
  TOOL_RESULT_STATUS_DENIED = 4;
}

message ToolResult {
  string call_id = 1;
  ToolResultStatus status = 2;
  repeated ContentPart content = 3;
  google.protobuf.Struct structured_result = 4;
  Error error = 5;
  google.protobuf.Duration duration = 6;
  bool truncated = 7;
  repeated string artifact_refs = 8;
  bool redacted = 9;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_REJECTED = 3;
  APPROVAL_STATUS_EXPIRED = 4;
  APPROVAL_STATUS_CANCELLED = 5;
}

message Approval {
  string approval_id = 1;
  string session_id = 2;
  string call_id = 3;
  string action_summary = 4;
  string risk_level = 5;
  ApprovalStatus status = 6;
  string requested_by = 7;
  google.protobuf.Timestamp expires_at = 8;
  string decided_by = 9;
  string reason = 10;
  google.protobuf.Timestamp decided_at = 11;
}

message ListToolsRequest {
  string session_id = 1;
}

message ListToolsResponse {
  repeated ToolDefinition tools = 1;
}

message ExecuteToolRequest {
  ToolCall call = 1;
}

message ToolExecutionEvent {
  string call_id = 1;
  string phase = 2;
  repeated ContentPart content = 3;
  ToolResult final_result = 4;
}

message ResolveApprovalRequest {
  string request_id = 1;
  string approval_id = 2;
  ApprovalStatus decision = 3;
  string decided_by = 4;
  string reason = 5;
}

message ResolveApprovalResponse {
  Approval approval = 1;
}

service ToolService {
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc Execute(ExecuteToolRequest) returns (stream ToolExecutionEvent);
}

service ApprovalService {
  rpc Resolve(ResolveApprovalRequest) returns (ResolveApprovalResponse);
}
